<title>Pacchi del giorno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FBF7F2; --surface:#FFFFFF; --surface-2:#F5EFE7; --ink:#2A2320; --muted:#857A72; --line:#EDE4DA;
  --accent:#E8643A; --accent-ink:#FFFFFF; --accent-soft:#FDE9E0;
  --done:#2E9466; --done-soft:#E0F3E9; --warn:#C8401A; --warn-soft:#FCE4DA;
  --shadow:0 1px 2px rgba(60,40,30,.05),0 6px 20px rgba(60,40,30,.07);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav:68px;
}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hello{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0}
.sub{margin-top:4px;color:var(--muted);font-size:15px}
.sub::first-letter{text-transform:uppercase}
.sync{margin-top:8px;width:10px;height:10px;border-radius:50%;background:var(--done);flex:none;box-shadow:0 0 0 4px var(--done-soft)}
.sync.local{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* week strip */
.weekhead{margin-top:20px;display:flex;align-items:center;justify-content:space-between}
.weekhead b{font-family:var(--display);font-weight:800;font-size:18px}
.weekhead b::first-letter{text-transform:uppercase}
.wnav{display:flex;gap:6px}
.wnav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600}
.week{margin-top:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dcell{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dcell .dl{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.dcell .dn{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.dcell .dc{font-size:11px;font-weight:700;min-height:15px;color:var(--accent)}
.dcell.today .dn{color:var(--accent)}
.dcell[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.dcell[aria-pressed="true"] .dl,.dcell[aria-pressed="true"] .dc{color:inherit;opacity:.8}
.dcell[aria-pressed="true"].today .dn{color:#fff}

/* summary */
.hero{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.hero .big{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.hero .small{margin-top:6px;color:var(--muted);font-size:15px;text-wrap:pretty}
.seg{display:flex;gap:3px;height:8px;margin-top:14px}
.seg i{display:block;height:100%;border-radius:4px;transition:flex-grow .4s}
.legend{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.nudge{margin-top:12px;width:100%;text-align:left;border:0;background:var(--accent-soft);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:12px;color:#8A3413;font-weight:600;font-size:15px}
.nudge .em{font-size:24px}
.nudge .go{margin-left:auto;font-size:22px;opacity:.6}

h2{font-family:var(--display);font-weight:800;font-size:24px;margin:24px 0 10px;letter-spacing:-.01em}
h3.grp{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
.cbody{flex:1;min-width:0}
.cname{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cline{margin-top:2px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;background:var(--ss);color:var(--sc);white-space:nowrap}

.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1.5px dashed var(--line);border-radius:20px;font-size:15px}
.empty .em{font-size:40px;display:block;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:4px}

/* search */
.search{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px;margin-top:16px}

/* month */
.mstats{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.mstat b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.mstat span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.cbar{display:grid;grid-template-columns:72px 1fr 32px;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.cbar .tr{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.cbar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.cbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.wide{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700;margin-top:18px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:520px;margin:0 auto;height:var(--nav);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);height:100%;justify-content:center;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.plus{justify-self:center;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(232,100,58,.4);margin-top:-26px;display:grid;place-items:center}
.plus svg{width:30px;height:30px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(40,28,22,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:25px;margin:0 0 4px;letter-spacing:-.01em}
.sheet .lead{color:var(--muted);font-size:15px;margin:0 0 8px}
.f{display:block;margin-top:14px}
.f>span{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.f input,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:13px 14px;font-size:17px}
.f textarea{resize:vertical;min-height:70px}
.mono{font-family:var(--mono)}
.trkrow{display:flex;gap:8px}
.trkrow input{flex:1;min-width:0}
.trkrow button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-weight:600;font-size:15px}
.cgrid{display:flex;flex-wrap:wrap;gap:8px}
.cgrid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;min-height:44px}
.cgrid button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row2{display:flex;gap:12px}
.row2>.f{flex:1;min-width:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;height:50px}
.stepper button{width:48px;height:100%;border:0;background:none;font-size:22px;font-weight:600}
.stepper output{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sbtns{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.sbtns button{height:54px;border-radius:16px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.sbtns .pri{background:var(--accent);border-color:var(--accent);color:#fff}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:600;height:44px;width:100%}
.linkbtn.warn{color:var(--warn)}

/* detail */
.dhead{display:flex;align-items:center;gap:14px}
.dhead .av{width:58px;height:58px;font-size:21px}
.dinfo{margin-top:14px;background:var(--surface-2);border-radius:16px;padding:4px 14px}
.dinfo div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.dinfo div:last-child{border-bottom:0}
.dinfo dt{color:var(--muted)}
.dinfo dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.dinfo dd.mono{font-weight:500}
.sheet h3.grp{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.06em;margin:22px 0 8px}
.stlist{margin-top:0;display:flex;flex-direction:column;gap:8px}
.stbtn{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;min-height:56px}
.stbtn .em{font-size:22px;width:28px;text-align:center}
.stbtn b{display:block;font-size:16px}
.stbtn small{display:block;color:var(--muted);font-size:13px}
.stbtn[aria-pressed="true"]{border-color:var(--sc);background:var(--ss)}
.stbtn[aria-pressed="true"] b{color:var(--sc)}
.stbtn .ck{margin-left:auto;font-weight:800;color:var(--sc)}
.actrow{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actrow a,.actrow button{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);font-size:16px}
.actrow a{background:var(--ink);color:#fff;border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;font-weight:600;z-index:20;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center;animation:up .2s}

@media (max-width:360px){
  .hello{font-size:26px}
  .dcell .dn{font-size:17px}
  .hero .big{font-size:20px}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 class="hello" id="hello">Ciao!</h1>
      <div class="sub" id="sub"></div>
    </div>
    <span class="sync" id="sync" title="Collegamento…"></span>
  </header>

  <!-- GIORNO -->
  <section id="v-giorno">
    <div class="weekhead"><b id="wLbl"></b>
      <div class="wnav"><button id="wPrev" aria-label="Settimana prima">‹</button><button id="wNext" aria-label="Settimana dopo">›</button></div>
    </div>
    <div class="week" id="week"></div>
    <div class="hero" id="hero"></div>
    <button class="nudge" id="nudge" hidden></button>
    <h2 id="dayTitle"></h2>
    <div class="list" id="dayList"></div>
  </section>

  <!-- DA SEGUIRE -->
  <section id="v-seguire" hidden>
    <h2>Da seguire</h2>
    <p class="sub" style="margin-top:-4px">I pacchi che non sono ancora arrivati, dal più vecchio.</p>
    <div id="openList"></div>
  </section>

  <!-- CERCA -->
  <section id="v-cerca" hidden>
    <h2>Cerca un pacco</h2>
    <input class="search" id="q" type="search" placeholder="Nome, città o numero di tracking" autocomplete="off" enterkeyhint="search">
    <div class="list" id="findList" style="margin-top:14px"></div>
  </section>

  <!-- MESE -->
  <section id="v-mese" hidden>
    <div class="weekhead" style="margin-top:22px"><b id="mLbl"></b>
      <div class="wnav"><button id="mPrev" aria-label="Mese prima">‹</button><button id="mNext" aria-label="Mese dopo">›</button></div>
    </div>
    <div id="mBody"></div>
  </section>
</div>

<nav class="nav"><div class="in">
  <button class="tab" data-v="giorno" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Giorno</button>
  <button class="tab" data-v="seguire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7h11v9h-11zM13.5 10h4l3 3v3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Da seguire<span class="dot" id="openDot" hidden></span></button>
  <button class="plus" id="plus" aria-label="Aggiungi un pacco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-v="cerca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Cerca</button>
  <button class="tab" data-v="mese"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Mese</button>
</div></nav>

<!-- form -->
<div class="scrim" id="formScrim" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <div class="grab"></div>
    <h3 id="fTitle">Nuovo pacco</h3>
    <p class="lead" id="fLead"></p>
    <label class="f"><span>A chi lo mandi?</span><input name="destinatario" placeholder="Nome, cognome o negozio" autocapitalize="words" enterkeyhint="next"></label>
    <label class="f"><span>Dove va?</span><input name="citta" placeholder="Città" autocapitalize="words" enterkeyhint="next"></label>
    <div class="f"><span>Con quale corriere?</span><div class="cgrid" id="fCar"></div></div>
    <label class="f"><span>Numero di tracking</span>
      <div class="trkrow"><input class="mono" name="tracking" id="fTrk" placeholder="Lo trovi sull'etichetta" autocapitalize="characters" spellcheck="false" enterkeyhint="done"><button type="button" id="fPaste">Incolla</button></div>
    </label>
    <div class="row2">
      <div class="f"><span>Colli</span><div class="stepper"><button type="button" id="cMinus" aria-label="Meno">−</button><output id="cOut">1</output><button type="button" id="cPlus" aria-label="Più">+</button></div></div>
      <label class="f"><span>Spedito il</span><input type="date" name="data" required></label>
    </div>
    <label class="f"><span>Una nota <span style="font-weight:400;color:var(--muted)">(se serve)</span></span><textarea name="note" placeholder="Es. ordine n. 1042, fragile, citofono Rossi…"></textarea></label>
    <div class="sbtns">
      <button type="submit" class="pri" id="fSave">Salva pacco</button>
      <button type="button" id="fMore">Salva e aggiungine un altro</button>
      <button type="button" class="linkbtn" id="fCancel">Annulla</button>
    </div>
  </form>
</div>

<!-- detail -->
<div class="scrim" id="detScrim" hidden>
  <div class="sheet" id="det"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  n.append(...kids.flat().filter(k => k != null && k !== false));
  return n;
}
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const shift = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const fmt = (s, opt) => parse(s).toLocaleDateString("it-IT", opt);
const daysAgo = s => Math.round((parse(today()) - parse(s)) / 864e5);
const relDay = s => { const n = daysAgo(s); return n === 0 ? "oggi" : n === 1 ? "ieri" : n === -1 ? "domani" : n > 1 ? `${n} giorni fa` : fmt(s, { day: "numeric", month: "short" }); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const buzz = () => { try { navigator.vibrate?.(12); } catch {} };
const plural = (n, one, many) => n === 1 ? one : many.replace("#", n);

const STATI = [
  { k: "preparato",  l: "Da spedire", em: "📦", d: "Pronto, ma non ancora partito",  c: "#7A6A5E", s: "#F1EAE2" },
  { k: "spedito",    l: "Al corriere", em: "🤝", d: "L'hai consegnato al corriere",  c: "#2F6FE4", s: "#E5EDFD" },
  { k: "transito",   l: "In viaggio", em: "🚚", d: "Sta viaggiando verso il destinatario", c: "#A26F00", s: "#FBF0D3" },
  { k: "consegnato", l: "Arrivato",   em: "✅", d: "Il destinatario l'ha ricevuto",  c: "#2E9466", s: "#E0F3E9" },
  { k: "problema",   l: "Problema",   em: "⚠️", d: "Giacenza, ritardo o danno",      c: "#C8401A", s: "#FCE4DA" },
];
const ST = Object.fromEntries(STATI.map(s => [s.k, s]));
const isOpen = p => p.stato !== "consegnato";

const enc = encodeURIComponent;
const CARRIERS = {
  "BRT":    t => "https://parcelsapp.com/it/tracking/" + enc(t),
  "GLS":    t => "https://gls-group.com/IT/it/servizi-online/ricerca-spedizioni?match=" + enc(t),
  "SDA":    t => "https://www.sda.it/wps/portal/Servizi_online/dettaglio-spedizione?locale=it&tracing.letteraVettura=" + enc(t),
  "Poste":  t => "https://www.poste.it/cerca/index.html#/risultati-spedizioni/" + enc(t),
  "DHL":    t => "https://www.dhl.com/it-it/home/tracking.html?tracking-id=" + enc(t),
  "UPS":    t => "https://www.ups.com/track?loc=it_IT&tracknum=" + enc(t),
  "FedEx":  t => "https://www.fedex.com/fedextrack/?trknbr=" + enc(t),
  "InPost": t => "https://parcelsapp.com/it/tracking/" + enc(t),
  "Altro":  t => "https://parcelsapp.com/it/tracking/" + enc(t),
};
const AVC = ["#E8643A","#2F6FE4","#2E9466","#9B51E0","#C9850C","#D9467A","#0E9AA7","#5C6AC4"];
function avatar(p){
  const name = (p.destinatario || p.citta || p.tracking || "?").trim();
  const ini = name.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
  let h = 0; for (const ch of name.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return el("span", { class: "av", style: "background:" + AVC[h % AVC.length], "aria-hidden": "true" }, ini);
}
const who = p => p.destinatario || (p.citta ? "Pacco per " + p.citta : "Pacco senza nome");
const first = p => (p.destinatario || "").split(/\s+/)[0];

const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let db = null, mode = "loading", pacchi = [];
let view = "giorno", day = today(), month = today().slice(0, 7), query = "", editing = null, detailId = null;
let lastCarrier = ls.get("pacchi.carrier") || "BRT";
const chains = {};

/* ---------- persistence ---------- */
function setSync(kind){
  const s = $("#sync");
  s.classList.toggle("local", kind === "local");
  s.title = kind === "cloud" ? "Sincronizzato su tutti i tuoi dispositivi" : kind === "local" ? "Salvato solo su questo telefono" : "Collegamento…";
}
function save(p){
  p.updated = Date.now();
  if (mode !== "cloud") { ls.set("pacchi.local", pacchi); return; }
  const { id, ...body } = JSON.parse(JSON.stringify(p));
  chains[id] = (chains[id] || Promise.resolve())
    .then(() => db.doc("pacchi/" + id).set(body))
    .catch(e => toast(e?.code === "quota_exceeded" ? "Lo spazio è pieno: scarica il mese ed elimina i pacchi vecchi." : "Ops, non sono riuscito a salvare. Riprova tra un attimo."));
}
function remove(id){
  if (mode !== "cloud") { ls.set("pacchi.local", pacchi); return; }
  (chains[id] || Promise.resolve()).then(() => db.doc("pacchi/" + id).delete()).catch(() => toast("Non sono riuscito a eliminarlo. Riprova."));
}
function startLocal(){
  mode = "local"; setSync("local");
  pacchi = ls.get("pacchi.local") || [];
  render();
}
async function boot(){
  render();
  if (!window.claude?.use) return startLocal();
  db = await window.claude.use("db").catch(() => null);
  if (!db) return startLocal();
  mode = "cloud"; setSync("cloud");
  db.collection("pacchi").onSnapshot(snap => {
    pacchi = snap.docs.map(d => ({ stato: "spedito", colli: 1, ...JSON.parse(JSON.stringify(d.data())), id: d.id }))
      .filter(p => typeof p.data === "string");
    render();
    if (detailId) { const p = pacchi.find(x => x.id === detailId); p ? drawDetail(p) : closeDetail(); }
  }, () => { setSync("local"); toast("Ho perso la connessione. Ricarica la pagina."); });
}

/* ---------- shared pieces ---------- */
const byNew = (a, b) => (b.created || 0) - (a.created || 0);
function card(p, when){
  const s = ST[p.stato] || ST.spedito;
  const bits = [p.citta, p.corriere, when ? relDay(p.data) : null, (Number(p.colli) || 1) > 1 ? p.colli + " colli" : null].filter(Boolean);
  return el("button", { class: "card", onclick: () => openDetail(p) },
    avatar(p),
    el("span", { class: "cbody" },
      el("span", { class: "cname", style: "display:block" }, who(p)),
      el("span", { class: "cline", style: "display:block" }, bits.join(" · ") || "Nessun dettaglio")),
    el("span", { class: "badge", style: `--sc:${s.c};--ss:${s.s}` }, s.em, " ", s.l));
}
function empty(em, title, text){ return el("div", { class: "empty" }, el("span", { class: "em" }, em), el("b", {}, title), text); }

/* ---------- views ---------- */
function render(){
  const h = new Date().getHours();
  $("#hello").textContent = h < 5 ? "Ancora sveglio? 🌙" : h < 13 ? "Buongiorno ☀️" : h < 18 ? "Buon pomeriggio 👋" : "Buonasera 🌆";
  $("#sub").textContent = fmt(today(), { weekday: "long", day: "numeric", month: "long" });
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.v === view ? "page" : "false"));
  for (const v of ["giorno", "seguire", "cerca", "mese"]) $("#v-" + v).hidden = v !== view;
  const open = pacchi.filter(isOpen);
  $("#openDot").hidden = !open.length; $("#openDot").textContent = open.length > 99 ? "99+" : open.length;
  ({ giorno: renderDay, seguire: renderOpen, cerca: renderFind, mese: renderMonth })[view]();
}

function renderDay(){
  // week strip
  const d0 = parse(day), mon = shift(day, -((d0.getDay() + 6) % 7));
  $("#wLbl").textContent = fmt(day, { month: "long", year: "numeric" });
  $("#week").replaceChildren(...Array.from({ length: 7 }, (_, i) => {
    const d = shift(mon, i), n = pacchi.filter(p => p.data === d).length;
    return el("button", { class: "dcell" + (d === today() ? " today" : ""), "aria-pressed": String(d === day), "aria-label": fmt(d, { weekday: "long", day: "numeric", month: "long" }) + ", " + plural(n, "1 pacco", "# pacchi"), onclick: () => { day = d; buzz(); render(); } },
      el("span", { class: "dl" }, fmt(d, { weekday: "short" }).slice(0, 3)),
      el("span", { class: "dn" }, String(parse(d).getDate())),
      el("span", { class: "dc" }, n ? String(n) : ""));
  }));

  // summary
  const isToday = day === today(), ofDay = pacchi.filter(p => p.data === day).sort(byNew);
  const n = k => ofDay.filter(p => p.stato === k).length, tot = ofDay.length;
  const ok = n("consegnato"), ko = n("problema"), moving = tot - ok - ko - n("preparato"), ready = n("preparato");
  const when = isToday ? "Oggi" : daysAgo(day) === 1 ? "Ieri" : daysAgo(day) < 0 ? "Quel giorno" : "Il " + fmt(day, { day: "numeric", month: "long" });
  let big, small;
  if (!tot) {
    big = isToday ? "Oggi non è ancora partito nessun pacco." : daysAgo(day) < 0 ? "Questo giorno deve ancora arrivare." : when + " non hai registrato spedizioni.";
    small = isToday ? "Quando ne prepari uno, tocca il + qui sotto e lo segniamo insieme." : "Se te ne sei dimenticato uno, puoi aggiungerlo ora con il +.";
  } else {
    big = `${when} ${plural(tot, "è partito 1 pacco", "sono partiti # pacchi")}${tot >= 10 ? ". Bella giornata! 💪" : "."}`;
    if (ok === tot) small = plural(tot, "È già arrivato a destinazione. 🎉", "Sono già arrivati tutti. Ottimo lavoro! 🎉");
    else {
      const parts = [
        ok && plural(ok, "1 è già arrivato", "# sono già arrivati"),
        moving && plural(moving, "1 è in viaggio", "# sono in viaggio"),
        ready && plural(ready, "1 è ancora da spedire", "# sono ancora da spedire"),
        ko && plural(ko, "1 ha bisogno di attenzione", "# hanno bisogno di attenzione"),
      ].filter(Boolean);
      small = (parts.length > 1 ? parts.slice(0, -1).join(", ") + " e " + parts.at(-1) : parts[0]) + ".";
      small = small[0].toUpperCase() + small.slice(1);
    }
  }
  $("#hero").replaceChildren(
    el("div", { class: "big" }, big), el("div", { class: "small" }, small),
    tot ? el("div", { class: "seg" }, STATI.filter(s => n(s.k)).map(s => el("i", { style: `flex-grow:${n(s.k)};background:${s.c}` }))) : null,
    tot ? el("div", { class: "legend" }, STATI.filter(s => n(s.k)).map(s => el("span", {}, el("i", { style: "background:" + s.c }), `${n(s.k)} ${s.l.toLowerCase()}`))) : null);

  // older still open
  const old = pacchi.filter(p => isOpen(p) && p.data < today());
  const probs = old.filter(p => p.stato === "problema").length;
  $("#nudge").hidden = !isToday || !old.length;
  $("#nudge").replaceChildren(el("span", { class: "em" }, probs ? "⚠️" : "🚚"),
    el("span", {}, probs ? plural(probs, "Un pacco dei giorni scorsi ha un problema", "# pacchi dei giorni scorsi hanno un problema")
      : plural(old.length, "C'è ancora 1 pacco dei giorni scorsi per strada", "Ci sono ancora # pacchi dei giorni scorsi per strada")),
    el("span", { class: "go" }, "›"));

  $("#dayTitle").textContent = tot ? (isToday ? "I pacchi di oggi" : "I pacchi di " + fmt(day, { weekday: "long" })) : "";
  $("#dayTitle").hidden = !tot;
  $("#dayList").replaceChildren(...(tot ? ofDay.map(p => card(p)) : []));
}

function renderOpen(){
  const open = pacchi.filter(isOpen).sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : byNew(b, a));
  const box = $("#openList");
  if (!open.length) { box.replaceChildren(empty("🎉", "Tutto arrivato!", "Non c'è nessun pacco in sospeso. Goditi il momento.")); return; }
  const groups = [
    ["Hanno un problema", open.filter(p => p.stato === "problema")],
    ["In giro da più di 5 giorni", open.filter(p => p.stato !== "problema" && daysAgo(p.data) > 5)],
    ["Ancora in viaggio", open.filter(p => p.stato !== "problema" && daysAgo(p.data) <= 5)],
  ].filter(g => g[1].length);
  box.replaceChildren(...groups.flatMap(([t, ps]) => [el("h3", { class: "grp" }, `${t} · ${ps.length}`), el("div", { class: "list" }, ps.map(p => card(p, true)))]));
}

function renderFind(){
  const box = $("#findList");
  if (!query) { box.replaceChildren(empty("🔎", "Chi stai cercando?", "Scrivi un nome, una città o anche solo una parte del tracking.")); return; }
  const q = query.toLowerCase().replace(/\s+/g, " ");
  const hits = pacchi.filter(p => [p.tracking, p.destinatario, p.citta, p.note, p.corriere].some(v => (v || "").toLowerCase().includes(q)))
    .sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : byNew(a, b));
  box.replaceChildren(...(hits.length ? hits.slice(0, 200).map(p => card(p, true)) : [empty("🤔", "Non trovo niente", `Nessun pacco corrisponde a «${query}».`)]));
}

function renderMonth(){
  const [y, m] = month.split("-").map(Number);
  $("#mLbl").textContent = new Date(y, m - 1, 1).toLocaleDateString("it-IT", { month: "long", year: "numeric" });
  const rows = pacchi.filter(p => p.data.startsWith(month));
  const box = $("#mBody");
  if (!rows.length) { box.replaceChildren(empty("🗓️", "Mese tranquillo", "In questo mese non ci sono spedizioni registrate.")); return; }
  const ok = rows.filter(p => p.stato === "consegnato").length, ko = rows.filter(p => p.stato === "problema").length;
  const colli = rows.reduce((s, p) => s + (Number(p.colli) || 1), 0);
  const days = new Set(rows.map(p => p.data)).size;
  const byC = {}; rows.forEach(p => byC[p.corriere || "Altro"] = (byC[p.corriere || "Altro"] || 0) + 1);
  const cs = Object.entries(byC).sort((a, b) => b[1] - a[1]), max = cs[0][1];
  box.replaceChildren(
    el("div", { class: "hero" },
      el("div", { class: "big" }, `${plural(rows.length, "1 pacco spedito", "# pacchi spediti")} ${month === today().slice(0, 7) ? "questo mese" : "a " + new Date(y, m - 1, 1).toLocaleDateString("it-IT", { month: "long" })}.`),
      el("div", { class: "small" }, days === 1 ? "Tutti nello stesso giorno." : `In media ${(rows.length / days).toLocaleString("it-IT", { maximumFractionDigits: 1 })} al giorno, nei ${days} giorni in cui hai spedito.`)),
    el("div", { class: "mstats" },
      el("div", { class: "mstat" }, el("b", {}, String(colli)), el("span", {}, "Colli")),
      el("div", { class: "mstat" }, el("b", { style: "color:var(--done)" }, Math.round(ok / rows.length * 100) + "%"), el("span", {}, "Arrivati")),
      el("div", { class: "mstat" }, el("b", { style: ko ? "color:var(--warn)" : "" }, String(ko)), el("span", {}, "Con problemi"))),
    el("h3", { class: "grp", style: "margin-top:24px" }, "Per corriere"),
    ...cs.map(([c, n]) => el("div", { class: "cbar" }, el("span", {}, c), el("span", { class: "tr" }, el("i", { style: `width:${n / max * 100}%` })), el("span", { class: "n" }, String(n)))),
    el("button", { class: "wide", onclick: () => exportCsv(rows, `pacchi-${month}.csv`) }, "⬇︎  Scarica il mese per Excel"));
}

/* ---------- detail ---------- */
function openDetail(p){ detailId = p.id; drawDetail(p); $("#detScrim").hidden = false; buzz(); }
function closeDetail(){ detailId = null; $("#detScrim").hidden = true; }
function setStato(p, k){
  if (p.stato === k) return;
  p.stato = k; save(p); buzz(); render(); drawDetail(p);
  const name = first(p);
  toast(k === "consegnato" ? (name ? `Evviva, ${name} ha ricevuto il pacco! 🎉` : "Evviva, è arrivato! 🎉")
    : k === "problema" ? "Segnato. Lo trovi in «Da seguire» finché non si risolve."
    : k === "transito" ? "In viaggio 🚚" : `Fatto: ${ST[k].l.toLowerCase()}`);
}
function drawDetail(p){
  const s = ST[p.stato] || ST.spedito;
  const link = p.tracking && (CARRIERS[p.corriere] || CARRIERS.Altro)(p.tracking);
  const info = [
    ["Corriere", p.corriere || "—"],
    ["Tracking", p.tracking || "Non inserito", p.tracking ? "mono" : null],
    ["Spedito", relDay(p.data) === "oggi" || relDay(p.data) === "ieri" ? relDay(p.data) + ", " + fmt(p.data, { day: "numeric", month: "long" }) : fmt(p.data, { weekday: "long", day: "numeric", month: "long" })],
    (Number(p.colli) || 1) > 1 ? ["Colli", String(p.colli)] : null,
    p.note ? ["Nota", p.note] : null,
  ].filter(Boolean);
  $("#det").replaceChildren(
    el("div", { class: "grab" }),
    el("div", { class: "dhead" }, avatar(p), el("div", { style: "min-width:0" },
      el("h3", { style: "overflow-wrap:anywhere" }, who(p)),
      el("div", { class: "sub", style: "margin:0" }, [p.citta, s.em + " " + s.l].filter(Boolean).join(" · ")))),
    el("dl", { class: "dinfo", style: "margin:14px 0 0" }, info.map(([k, v, c]) => el("div", {}, el("dt", {}, k), el("dd", { class: c }, v)))),
    el("div", { class: "actrow" },
      link ? el("a", { href: link, target: "_blank", rel: "noopener" }, "Traccia ↗") : el("button", { onclick: () => { closeDetail(); openForm(p); } }, "+ Tracking"),
      p.tracking ? el("button", { onclick: () => copy(p.tracking) }, "Copia numero") : el("button", { onclick: () => { closeDetail(); openForm(p); } }, "Modifica")),
    el("h3", { class: "grp" }, "A che punto è?"),
    el("div", { class: "stlist" }, STATI.map(x => el("button", { class: "stbtn", "aria-pressed": String(x.k === p.stato), style: `--sc:${x.c};--ss:${x.s}`, onclick: () => setStato(p, x.k) },
      el("span", { class: "em" }, x.em), el("span", {}, el("b", {}, x.l), el("small", {}, x.d)), x.k === p.stato ? el("span", { class: "ck" }, "✓") : null))),
    el("div", { class: "sbtns" },
      el("button", { onclick: () => { closeDetail(); openForm(p); } }, "Modifica i dati"),
      el("button", { class: "linkbtn warn", onclick: () => {
        if (!confirm(`Vuoi davvero eliminare il pacco per ${who(p)}?`)) return;
        pacchi = pacchi.filter(x => x.id !== p.id); remove(p.id); closeDetail(); render(); toast("Pacco eliminato");
      } }, "Elimina questo pacco"),
      el("button", { class: "linkbtn", onclick: closeDetail }, "Chiudi")));
}
$("#detScrim").addEventListener("click", e => { if (e.target.id === "detScrim") closeDetail(); });

/* ---------- form ---------- */
const form = $("#form");
let fCarrier = lastCarrier, colli = 1;
function drawCarriers(){
  $("#fCar").replaceChildren(...Object.keys(CARRIERS).map(c =>
    el("button", { type: "button", "aria-pressed": String(c === fCarrier), onclick: () => { fCarrier = c; buzz(); drawCarriers(); } }, c)));
}
const setColli = n => { colli = Math.max(1, Math.min(99, n)); $("#cOut").textContent = colli; };
$("#cMinus").onclick = () => setColli(colli - 1);
$("#cPlus").onclick = () => setColli(colli + 1);
function openForm(p){
  editing = p || null;
  form.reset();
  $("#fTitle").textContent = p ? "Modifica pacco" : "Nuovo pacco 📦";
  $("#fLead").textContent = p ? "Correggi quello che serve." : "Bastano due cose: a chi va e il tracking. Il resto è facoltativo.";
  $("#fMore").hidden = !!p;
  $("#fSave").textContent = p ? "Salva le modifiche" : "Salva pacco";
  fCarrier = p?.corriere || lastCarrier;
  form.destinatario.value = p?.destinatario || "";
  form.citta.value = p?.citta || "";
  form.tracking.value = p?.tracking || "";
  form.data.value = p?.data || (view === "giorno" ? day : today());
  form.note.value = p?.note || "";
  setColli(Number(p?.colli) || 1);
  drawCarriers();
  $("#formScrim").hidden = false;
  buzz();
}
function closeForm(){ $("#formScrim").hidden = true; editing = null; document.activeElement?.blur(); }
function commit(){
  const v = {
    destinatario: form.destinatario.value.trim(),
    citta: form.citta.value.trim(),
    corriere: fCarrier,
    tracking: form.tracking.value.trim().replace(/\s+/g, "").toUpperCase(),
    data: form.data.value || today(),
    colli,
    note: form.note.value.trim(),
  };
  if (!v.tracking && !v.destinatario) { toast("Scrivi almeno a chi va o il numero di tracking 🙂"); form.destinatario.focus(); return false; }
  const dup = v.tracking && pacchi.find(p => p !== editing && p.tracking === v.tracking);
  lastCarrier = fCarrier; ls.set("pacchi.carrier", lastCarrier);
  let p = editing;
  if (p) Object.assign(p, v);
  else { p = { id: uid(), created: Date.now(), stato: "spedito", ...v }; pacchi.push(p); }
  save(p); buzz();
  if (!editing) day = v.data;
  render();
  toast(dup ? "Salvato, ma occhio: questo tracking c'era già 👀"
    : editing ? "Modifiche salvate 👍"
    : v.destinatario ? `Fatto! Il pacco per ${first(p)} è registrato.` : "Fatto! Pacco registrato.");
  return true;
}
form.addEventListener("submit", e => { e.preventDefault(); if (commit()) closeForm(); });
$("#fMore").onclick = () => {
  if (!commit()) return;
  const keepDate = form.data.value;
  form.reset(); form.data.value = keepDate; setColli(1);
  $("#form").scrollTop = 0;
  form.destinatario.focus();
};
$("#fCancel").onclick = closeForm;
$("#formScrim").addEventListener("click", e => { if (e.target.id === "formScrim") closeForm(); });
$("#fPaste").onclick = async () => {
  try { const t = (await navigator.clipboard.readText()).trim(); if (t) { form.tracking.value = t.replace(/\s+/g, ""); buzz(); } else toast("Gli appunti sono vuoti"); }
  catch { form.tracking.focus(); toast("Tieni premuto nel campo e scegli «Incolla»"); }
};
form.tracking.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); form.tracking.blur(); } });

/* ---------- controls ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  view = t.dataset.v; buzz(); render(); window.scrollTo({ top: 0 });
  if (view === "cerca") setTimeout(() => $("#q").focus(), 60);
});
$("#plus").onclick = () => openForm();
$("#wPrev").onclick = () => { day = shift(day, -7); render(); };
$("#wNext").onclick = () => { day = shift(day, 7); render(); };
const shiftMonth = n => { const [y, m] = month.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); };
$("#mPrev").onclick = () => shiftMonth(-1);
$("#mNext").onclick = () => shiftMonth(1);
$("#nudge").onclick = () => { view = "seguire"; render(); window.scrollTo({ top: 0 }); };
$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderFind(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#formScrim").hidden) closeForm(); else if (!$("#detScrim").hidden) closeDetail(); } });

// swipe left/right on the week to change week
let sx = null;
$("#week").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("#week").addEventListener("touchend", e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) { day = shift(day, dx < 0 ? 7 : -7); buzz(); render(); }
});

let tt;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600);
}
async function copy(txt){
  try { await navigator.clipboard.writeText(txt); buzz(); toast("Numero copiato 📋"); } catch { toast(txt); }
}
async function exportCsv(rows, filename){
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const head = ["Data", "Destinatario", "Città", "Corriere", "Tracking", "Colli", "Stato", "Note"];
  const csv = "﻿" + [head, ...rows.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : byNew(b, a))
    .map(p => [p.data, p.destinatario, p.citta, p.corriere, p.tracking, p.colli, ST[p.stato]?.l, p.note])]
    .map(r => r.map(q).join(";")).join("\r\n");
  const dl = await window.claude?.use?.("downloads").catch(() => null);
  if (dl) {
    try { await dl.save({ filename, data: csv }); } catch (e) { if (e?.code !== "declined") toast("Il download non è riuscito."); }
    return;
  }
  const a = el("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: filename });
  document.body.append(a); a.click(); a.remove();
}

boot();
</script>
